name: Deploy to Hostinger

on:
  push:
    branches: [main]

# Prevent overlapping deploys from concurrent pushes; queue instead of cancel
# so a deploy already in progress is never interrupted mid-way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, xml, dom, ctype, json, tokenizer, curl, fileinfo, openssl, bcmath, filter, hash
          coverage: none

      # .env here is a throwaway file for this CI run only — built from the
      # committed .env.example (no real secrets). Created before `composer
      # install` so package-discovery boots against a consistent environment,
      # and deleted before packaging so it can never end up in the deploy
      # artifact.
      - name: Prepare ephemeral test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Remove ephemeral .env before packaging
        run: rm -f .env

      - name: Package deploy artifact
        run: |
          tar -czf deploy.tar.gz \
            app bootstrap config database public resources routes vendor artisan composer.json composer.lock
        # Deliberately excludes storage/ entirely — it's persistent server
        # state (uploads, logs, framework runtime cache), never CI output.

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Extract artifact
        run: mkdir -p release && tar -xzf deploy.tar.gz -C release

      # rsync with --delete keeps the server in sync with exactly what's in
      # this release, EXCEPT the excluded paths below, which rsync leaves
      # completely untouched (neither overwritten nor deleted) — this is how
      # .env, admin-uploaded images, the storage symlink, and logs survive
      # every deploy without any special-casing on the server side.
      #
      # /storage/ is excluded wholesale and deliberately: it's never part of
      # the CI artifact in the first place (see packaging step above), and a
      # partial exclude list would leave any storage/ subpath it doesn't name
      # exposed to --delete. bootstrap/cache/*.php is intentionally NOT
      # excluded — it's generated by the same `composer install` that
      # produced vendor/, so it must travel with it or the two can drift out
      # of sync.
      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH }}/
          SOURCE: release/
          ARGS: '-avzr --delete'
          EXCLUDE: '/.env, /storage/'

      - name: Run post-deploy commands on Hostinger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
